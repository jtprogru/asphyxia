name: Rust Release

on:
  push:
    tags:
      - '*'
  # Manual runs build every target and upload the archives as artifacts, so a
  # release can be rehearsed from any branch. Everything that publishes is
  # gated on a tag ref below, so a dispatch run cannot ship anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.rust_target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - os: macos-latest
            rust_target: aarch64-apple-darwin
          # GitHub no longer offers Intel macOS runners, so this one is cross-compiled
          # from the arm64 runner. Nothing here needs a host toolchain beyond the added
          # target: the crate has no build script and the macOS SDK ships a universal
          # libpcap stub, so the `-lpcap` the pcap crate emits resolves for x86_64 too.
          - os: macos-latest
            rust_target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build project
        run: cargo build --release --locked --target ${{ matrix.rust_target }}

      - name: Package binary
        shell: bash
        run: |
          archive="asphyxia-${{ matrix.rust_target }}.zip"
          mkdir -p dist
          cp "target/${{ matrix.rust_target }}/release/asphyxia" dist/
          chmod +x dist/asphyxia
          (cd dist && zip "../$archive" asphyxia)

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.rust_target }}
          path: asphyxia-${{ matrix.rust_target }}.zip

  build-musl:
    name: Build ${{ matrix.rust_target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Alpine is musl-native, so this is a plain native build, not a cross-compile.
      # The musl target links statically by default and Alpine ships libpcap.a, so the
      # result carries libpcap with it and runs on any Linux of the same architecture,
      # whatever libc that host has.
      - name: Build in Alpine
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e CARGO_TERM_COLOR=always \
            -e RUST_TARGET \
            rust:alpine sh -eu -c '
              apk add --no-cache musl-dev libpcap-dev
              cargo build --release --locked --target "$RUST_TARGET"
            '

      - name: Verify the binary is static
        run: |
          bin="target/${{ matrix.rust_target }}/release/asphyxia"
          file "$bin"
          # A static musl binary pulls in nothing at runtime, so it carries no NEEDED
          # entries. The shape differs per architecture: aarch64 has no dynamic section
          # at all, while x86_64 is a static-pie and keeps one for self-relocation, so
          # NEEDED is what to check rather than the presence of the section.
          if readelf -d "$bin" | grep -q NEEDED; then
            echo "::error::$bin is dynamically linked, expected a static musl build"
            readelf -d "$bin"
            exit 1
          fi

      - name: Package binary
        shell: bash
        run: |
          archive="asphyxia-${{ matrix.rust_target }}.zip"
          mkdir -p dist
          cp "target/${{ matrix.rust_target }}/release/asphyxia" dist/
          chmod +x dist/asphyxia
          (cd dist && zip "../$archive" asphyxia)

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.rust_target }}
          path: asphyxia-${{ matrix.rust_target }}.zip

  publish-crate:
    name: Publish to crates.io
    needs: [build-and-release, build-musl]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  create-release:
    needs: [build-and-release, build-musl]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Sign release archives
        env:
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          for f in artifacts/asphyxia-*.zip; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
              --armor --detach-sign "$f"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/asphyxia-*.zip
            artifacts/asphyxia-*.zip.asc

  updatehomebrew:
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout brew tap repo
        uses: actions/checkout@v7
        with:
          repository: jtprogru/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Generate Formula
        run: |
          TAG="${GITHUB_REF_NAME}"

          sha() { sha256sum "artifacts/$1" | awk '{print $1}'; }
          url() { echo "https://github.com/jtprogru/asphyxia/releases/download/${TAG}/$1"; }

          MAC_ARM="asphyxia-aarch64-apple-darwin.zip"
          MAC_X86="asphyxia-x86_64-apple-darwin.zip"
          LINUX_X86="asphyxia-x86_64-unknown-linux-gnu.zip"
          LINUX_ARM="asphyxia-aarch64-unknown-linux-gnu.zip"

          mkdir -p Formula
          # Two deviations from Cargo.toml, both required by the tap's CI:
          # `desc` drops the leading article that FormulaAudit/Desc rejects, and
          # there is no `version` stanza because brew scans the version out of the
          # release URL and audit calls an explicit one redundant. Both were once
          # hand-fixed in the tap and then reverted by this generator, so they live
          # here now.
          cat <<EOL > Formula/asphyxia.rb
          class Asphyxia < Formula
            desc "Fast and efficient network scanner written in Rust"
            homepage "https://github.com/jtprogru/asphyxia"

            on_macos do
              on_intel do
                url "$(url "$MAC_X86")"
                sha256 "$(sha "$MAC_X86")"
              end
              on_arm do
                url "$(url "$MAC_ARM")"
                sha256 "$(sha "$MAC_ARM")"
              end
            end

            on_linux do
              on_intel do
                url "$(url "$LINUX_X86")"
                sha256 "$(sha "$LINUX_X86")"
              end
              on_arm do
                url "$(url "$LINUX_ARM")"
                sha256 "$(sha "$LINUX_ARM")"
              end
            end

            def install
              bin.install "asphyxia"
            end
          end
          EOL

          echo "----- Generated Formula/asphyxia.rb -----"
          cat Formula/asphyxia.rb

      - name: Commit and push formula
        run: |
          # Identity and commit signing are configured by the import-gpg step.
          git add Formula/asphyxia.rb
          git commit -S -m "Update asphyxia to ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push origin main
