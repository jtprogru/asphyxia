      <text class="dim" x="35" y="0" text-anchor="middle">--syn</text>
    </g>
    <g transform="translate(400, 0)">
      <rect x="0" y="-18" width="62" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="31" y="0" text-anchor="middle">--sV</text>
    </g>
    <g transform="translate(472, 0)">
      <rect x="0" y="-18" width="78" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="39" y="0" text-anchor="middle">--nmap</text>
    </g>
    <g transform="translate(560, 0)">
      <rect x="0" y="-18" width="95" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="47" y="0" text-anchor="middle">--resume</text>
    </g>
    <g transform="translate(665, 0)">
      <rect x="0" y="-18" width="172" height="26" rx="13" fill="#F74C00" fill-opacity="0.10" stroke="#F74C00" stroke-opacity="0.35"/>
      <text class="org" x="86" y="0" text-anchor="middle">json · csv · grep</text>
    </g>
  </g>

  <text class="mono dim" x="1208" y="604" font-size="14" text-anchor="end">github.com/jtprogru/asphyxia</text>
</svg>
