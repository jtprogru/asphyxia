  <text class="mono dim" x="1208" y="248" font-size="13" text-anchor="end" letter-spacing="1.4" fill-opacity="0.7">65535 PORTS · /8 … /32</text>

  <!-- brand block -->
  <g transform="translate(72, 96)">
    <rect x="0" y="0" width="292" height="28" rx="14" fill="#F74C00" fill-opacity="0.14" stroke="#F74C00" stroke-opacity="0.45"/>
    <text class="mono org" x="16" y="19" font-size="13" letter-spacing="1.6">RUST · NETWORK SCANNER · CLI</text>

    <text class="mono fg" x="0" y="112" font-size="76" font-weight="700" letter-spacing="-1.5">asphyxia</text>

    <text class="sans dim" x="2" y="158" font-size="24">Fast parallel network scanner: open ports, live hosts, whole subnets.</text>
    <text class="sans dim" x="2" y="192" font-size="24">TCP, UDP and SYN. Text for humans; JSON, JSONL, CSV and grep for pipelines.</text>
  </g>

  <!-- terminal -->
  <g transform="translate(72, 314)" filter="url(#shadow)">
    <rect x="0" y="0" width="1136" height="262" rx="14" fill="#0a0e14" stroke="#2a313c"/>
    <rect x="0" y="0" width="1136" height="40" rx="14" fill="#161b22"/>
    <rect x="0" y="26" width="1136" height="14" fill="#161b22"/>
    <line x1="0" y1="40" x2="1136" y2="40" stroke="#2a313c"/>
    <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="20" r="6" fill="#febc2e"/>
    <circle cx="68" cy="20" r="6" fill="#28c840"/>
    <text class="mono dim" x="568" y="25" font-size="13" text-anchor="middle">~/lab — zsh</text>

    <text class="mono" x="28" y="80" font-size="18"><tspan class="grn">➜</tspan><tspan class="cyn" dx="12">lab</tspan><tspan class="fg" dx="14">asphyxia ps -t</tspan><tspan class="cyn" dx="10">scanme.nmap.org</tspan><tspan class="fg" dx="10">--top-ports</tspan><tspan class="org" dx="10">1000</tspan><tspan class="fg" dx="10">--sV</tspan></text>
    <text class="mono" x="28" y="112" font-size="18"><tspan class="dim">--</tspan><tspan class="grn" dx="8">Opened ports</tspan><tspan class="dim" dx="8">for</tspan><tspan class="yel" dx="8">scanme.nmap.org</tspan><tspan class="dim" dx="8">--</tspan></text>
    <text class="mono" x="28" y="144" font-size="18"><tspan class="cyn">scanme.nmap.org</tspan><tspan class="dim">:</tspan><tspan class="grn">22</tspan><tspan class="mag" x="250">ssh</tspan><tspan class="dim" x="330" fill-opacity="0.8">[SSH-2.0-OpenSSH_6.6.1p1]</tspan></text>
    <text class="mono" x="28" y="172" font-size="18"><tspan class="cyn">scanme.nmap.org</tspan><tspan class="dim">:</tspan><tspan class="grn">80</tspan><tspan class="mag" x="250">http</tspan><tspan class="dim" x="330" fill-opacity="0.8">[HTTP/1.1 200 OK]</tspan></text>

    <text class="mono" x="28" y="212" font-size="18"><tspan class="grn">➜</tspan><tspan class="cyn" dx="12">lab</tspan><tspan class="fg" dx="14">asphyxia as -s</tspan><tspan class="cyn" dx="10">192.168.1.0/24</tspan><tspan class="fg" dx="10">-o</tspan><tspan class="org" dx="10">jsonl</tspan><tspan class="yel" dx="10">|</tspan><tspan class="fg" dx="10">asphyxia ps --stdin --top-ports</tspan><tspan class="org" dx="10">100</tspan></text>
    <text class="mono fg" x="28" y="240" font-size="17" fill-opacity="0.92">{"ip":"192.168.1.42","port":443,"proto":"tcp","latency_ms":3,"status":"open"}</text>
  </g>

  <!-- flag chips -->
  <g transform="translate(72, 604)" class="mono" font-size="14">
    <g>
      <rect x="0" y="-18" width="45" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
