<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="asphyxia — fast parallel network scanner in Rust: open ports, live hosts, whole subnets, over TCP, UDP and SYN">
  <title>asphyxia</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#1a1210"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F74C00"/>
      <stop offset="100%" stop-color="#FFB454"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F74C00" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#F74C00" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .dim  { fill: #8b949e; }
      .fg   { fill: #e6edf3; }
      .org  { fill: #ff8a4c; }
      .grn  { fill: #5BB359; }
      .cyn  { fill: #58c6d8; }
      .yel  { fill: #d8a657; }
      .mag  { fill: #c98bdf; }
      .red  { fill: #f0796a; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="1040" cy="130" rx="460" ry="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

